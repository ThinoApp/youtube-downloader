[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playlist-downloader"
version = "0.1.0"
description = "Desktop YouTube playlist downloader with range and custom item selection."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7,<7",
  "yt-dlp>=2025.1.15",
]

[project.scripts]
playlist-downloader = "youtube_downloader.app:main"

[tool.setuptools.packages.find]
include = ["youtube_downloader*"]
